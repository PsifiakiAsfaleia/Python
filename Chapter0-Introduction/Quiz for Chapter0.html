<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quiz.py — Chapter 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B1220;
    --bg-panel:#121A2B;
    --bg-editor:#0E1626;
    --border:#1F2A40;
    --py-blue:#4B8BBE;
    --py-yellow:#FFD43B;
    --text:#DCE4EE;
    --text-muted:#7D8BA3;
    --add-bg:#062d17;
    --add-border:#238636;
    --add-text:#3fb950;
    --rm-bg:#3a0d10;
    --rm-border:#da3633;
    --rm-text:#f85149;
    --gutter:#4C5A72;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg-deep);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(75,139,190,0.12), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255,212,59,0.06), transparent 40%);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .window{
    max-width:760px;
    margin:0 auto;
    background:var(--bg-editor);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.45);
  }
  .titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 14px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--border);
  }
  .dots{display:flex;gap:7px;flex-shrink:0;}
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.red{background:#FF5F57;}
  .dot.yellow{background:#FEBC2E;}
  .dot.green{background:#28C840;}
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tab b{color:var(--text);font-weight:600;}
  .badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    padding:4px 10px;
    border-radius:100px;
    border:1px solid var(--border);
    background:var(--bg-deep);
    color:var(--text-muted);
    white-space:nowrap;
    transition:all .25s ease;
  }
  .badge.live{color:var(--py-yellow);border-color:rgba(255,212,59,0.35);}
  .badge.pass{color:var(--add-text);border-color:var(--add-border);background:var(--add-bg);}

  .header{
    padding:28px 28px 8px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--py-yellow);
    letter-spacing:.06em;
    margin:0 0 6px;
  }
  h1{
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
    margin:0 0 6px;
    color:var(--text);
  }
  .sub{color:var(--text-muted);font-size:14px;margin:0 0 20px;line-height:1.5;}

  .qwrap{border-top:1px solid var(--border);}
  .q{
    display:flex;
    border-bottom:1px solid var(--border);
  }
  .gutter{
    width:44px;
    flex-shrink:0;
    text-align:right;
    padding:20px 10px 20px 0;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--gutter);
    background:rgba(255,255,255,0.015);
    border-right:1px solid var(--border);
    user-select:none;
  }
  .qbody{padding:20px 20px 20px 18px;flex:1;min-width:0;}
  .comment{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    margin:0 0 6px;
  }
  .prompt{
    font-size:15px;
    font-weight:500;
    margin:0 0 14px;
    line-height:1.5;
  }
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
    text-align:left;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:6px;
    padding:10px 12px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--py-blue);background:#152238;}
  .opt:focus-visible{outline:2px solid var(--py-yellow);outline-offset:2px;}
  .opt-key{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--py-blue);
    flex-shrink:0;
    margin-top:1px;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{
    background:var(--add-bg);
    border-color:var(--add-border);
    border-left-color:var(--add-border);
  }
  .opt.correct .opt-key{color:var(--add-text);}
  .opt.correct::before{content:"+ ";color:var(--add-text);font-family:'JetBrains Mono',monospace;}
  .opt.wrong{
    background:var(--rm-bg);
    border-color:var(--rm-border);
    border-left-color:var(--rm-border);
  }
  .opt.wrong .opt-key{color:var(--rm-text);}
  .opt.wrong::before{content:"- ";color:var(--rm-text);font-family:'JetBrains Mono',monospace;}
  .opt.dim{opacity:.45;}

  .console{
    display:none;
    margin-top:12px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    line-height:1.6;
    background:var(--bg-deep);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
  }
  .console.show{display:block;}
  .console .line-ok{color:var(--add-text);}
  .console .line-bad{color:var(--rm-text);}
  .console .explain{color:var(--text-muted);margin-top:4px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;}

  .footer{
    padding:26px 28px 30px;
    border-top:1px solid var(--border);
    background:var(--bg-panel);
  }
  .result-title{
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    margin:0 0 6px;
  }
  .result-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 16px;}
  .bar{
    height:8px;
    border-radius:100px;
    background:var(--border);
    overflow:hidden;
    margin-bottom:8px;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--py-blue), var(--py-yellow));
    transition:width .4s ease;
  }
  .reset{
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--bg-deep);
    background:var(--py-yellow);
    border:none;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:700;
  }
  .reset:hover{filter:brightness(1.06);}

  @media (max-width:480px){
    body{padding:16px 8px 48px;}
    .header{padding:22px 18px 6px;}
    .qbody{padding:16px 14px 16px 12px;}
    .gutter{width:32px;font-size:11px;padding:16px 6px 16px 0;}
    .footer{padding:20px 18px 24px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="dots">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    </div>
    <div class="tab">📄 <b>quiz.py</b> — chapter_0</div>
    <div class="badge live" id="scoreBadge">0 / 10 passing</div>
  </div>

  <div class="header">
    <p class="eyebrow"># review</p>
    <h1>Chapter 0 — Intro to Programming &amp; Python</h1>
    <p class="sub">Answer each question below. Right answers land like an added line, wrong ones like a removed one — just like reviewing a diff.</p>
  </div>

  <div class="qwrap" id="quiz"></div>

  <div class="footer">
    <p class="result-title" id="resultTitle">0 of 10 checks passing</p>
    <p class="result-sub" id="resultSub">Answer every question to run the full suite.</p>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <button class="reset" id="resetBtn" style="display:none;">↺ re-run quiz</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    comment: "# Q1 — definitions",
    prompt: "What is computer programming?",
    options: [
      "Creating a detailed set of instructions for a computer to perform a task",
      "Designing the physical circuits inside a computer",
      "Installing software on a computer",
      "Connecting a computer to the internet"
    ],
    correct: 0,
    explain: "Programming is writing a detailed set of instructions that tells a computer how to perform a task or solve a problem."
  },
  {
    comment: "# Q2 — history",
    prompt: "Who created Python?",
    options: ["Dennis Ritchie", "Guido van Rossum", "James Gosling", "Linus Torvalds"],
    correct: 1,
    explain: "Python was created by Guido van Rossum and released in 1991."
  },
  {
    comment: "# Q3 — history",
    prompt: "In what year was Python first released?",
    options: ["1985", "1991", "2000", "1995"],
    correct: 1,
    explain: "Python was released in 1991."
  },
  {
    comment: "# Q4 — use cases",
    prompt: "Which of these is NOT listed as a common use case for Python?",
    options: ["Artificial Intelligence", "Web Development", "Operating System Kernel Design", "Automation and Software Testing"],
    correct: 2,
    explain: "The notes list AI, Data Analysis, Web Development, Automation, and Software Testing — kernel design isn't mentioned."
  },
  {
    comment: "# Q5 — key feature",
    prompt: "Why is Python considered 'Beginner-Friendly'?",
    options: [
      "It uses complex symbols for precision",
      "It requires curly braces for structure",
      "It uses clear, readable syntax and indentation instead of complex symbols",
      "It has no rules about code structure"
    ],
    correct: 2,
    explain: "Beginner-friendliness comes from clear, readable syntax and indentation instead of curly braces or complex symbols."
  },
  {
    comment: "# Q6 — key feature",
    prompt: "What does it mean that Python is 'Interpreted'?",
    options: [
      "Code must be fully compiled before it can run",
      "Code executes line-by-line immediately, making testing and debugging fast",
      "Code only runs on specific hardware",
      "Code needs a separate translator app to run"
    ],
    correct: 1,
    explain: "Interpreted means code executes line-by-line immediately, speeding up testing and debugging."
  },
  {
    comment: "# Q7 — key feature",
    prompt: "What does 'Dynamically Typed' mean in Python?",
    options: [
      "You must declare variable types before using them",
      "Variable types are determined automatically at runtime",
      "Variables can never change type once set",
      "Types are checked only when the program is compiled"
    ],
    correct: 1,
    explain: "Dynamically typed means you don't declare types — Python determines them automatically at runtime."
  },
  {
    comment: "# Q8 — tooling",
    prompt: "What is Pip?",
    options: [
      "A built-in Python data type",
      "The standard package manager for Python, used to install external modules",
      "A Python code editor",
      "A type of Python loop"
    ],
    correct: 1,
    explain: "Pip is the standard package manager for Python, used to install external modules on your system."
  },
  {
    comment: "# Q9 — modules",
    prompt: "What is a module in Python?",
    options: [
      "A file containing Python code, typically with a .py extension",
      "A physical piece of computer hardware",
      "A type of variable",
      "An error message shown during execution"
    ],
    correct: 0,
    explain: "A module is simply a file containing Python code, with a .py extension."
  },
  {
    comment: "# Q10 — modules",
    prompt: "What's the key difference between built-in and external modules?",
    options: [
      "Built-in modules come preinstalled with Python; external modules need pip or conda to install",
      "Built-in modules need internet access; external modules don't",
      "External modules come preinstalled; built-in modules must be downloaded",
      "There is no real difference"
    ],
    correct: 0,
    explain: "Built-in modules are preinstalled with Python; external modules need pip or conda to be installed."
  }
];

const KEYS = ["A","B","C","D","E","F"];
let answered = new Array(QUESTIONS.length).fill(null);

function render(){
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = "";
  QUESTIONS.forEach((q, qi) => {
    const row = document.createElement('div');
    row.className = 'q';

    const gutter = document.createElement('div');
    gutter.className = 'gutter';
    gutter.textContent = String(qi + 1).padStart(2,'0');
    row.appendChild(gutter);

    const body = document.createElement('div');
    body.className = 'qbody';

    const comment = document.createElement('p');
    comment.className = 'comment';
    comment.textContent = q.comment;
    body.appendChild(comment);

    const prompt = document.createElement('p');
    prompt.className = 'prompt';
    prompt.textContent = q.prompt;
    body.appendChild(prompt);

    const opts = document.createElement('div');
    opts.className = 'opts';

    q.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="opt-key">' + KEYS[oi] + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => selectAnswer(qi, oi));
      opts.appendChild(btn);
    });
    body.appendChild(opts);

    const console_ = document.createElement('div');
    console_.className = 'console';
    console_.id = 'console-' + qi;
    body.appendChild(console_);

    row.appendChild(body);
    quiz.appendChild(row);
  });
}

function selectAnswer(qi, oi){
  if(answered[qi] !== null) return;
  answered[qi] = oi;

  const q = QUESTIONS[qi];
  const buttons = document.querySelectorAll('.q')[qi].querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if(i === q.correct) b.classList.add('correct');
    else if(i === oi) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const isCorrect = oi === q.correct;
  const console_ = document.getElementById('console-' + qi);
  console_.classList.add('show');
  console_.innerHTML =
    '<div class="' + (isCorrect ? 'line-ok' : 'line-bad') + '">' +
    (isCorrect ? '>>> assert answer == expected  # passed' : '>>> assert answer == expected  # failed') +
    '</div>' +
    '<div class="explain">' + q.explain + '</div>';

  updateScore();
}

function updateScore(){
  const done = answered.filter(a => a !== null).length;
  const correct = answered.reduce((sum, a, i) => sum + (a === QUESTIONS[i].correct ? 1 : 0), 0);

  const badge = document.getElementById('scoreBadge');
  badge.textContent = correct + ' / ' + QUESTIONS.length + ' passing';
  badge.className = 'badge' + (done === QUESTIONS.length ? ' pass' : ' live');

  document.getElementById('resultTitle').textContent = correct + ' of ' + QUESTIONS.length + ' checks passing';
  document.getElementById('barFill').style.width = (done / QUESTIONS.length * 100) + '%';

  const sub = document.getElementById('resultSub');
  if(done < QUESTIONS.length){
    sub.textContent = (QUESTIONS.length - done) + ' question(s) left to answer.';
  } else if(correct === QUESTIONS.length){
    sub.textContent = 'All checks passed. Chapter 0 merged. 🐍';
  } else {
    sub.textContent = 'Suite finished with ' + (QUESTIONS.length - correct) + ' failing check(s) — review the red lines above.';
  }

  document.getElementById('resetBtn').style.display = done === QUESTIONS.length ? 'inline-block' : 'none';
}

document.getElementById('resetBtn').addEventListener('click', () => {
  answered = new Array(QUESTIONS.length).fill(null);
  render();
  updateScore();
});

render();
updateScore();
</script>

</body>
</html>
